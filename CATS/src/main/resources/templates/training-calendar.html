<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Training Calendar - CATS</title>
		<style>
			body{font-family: Arial, sans-serif; margin: 2rem; color: #243247;}
			main{max-width: 1100px; margin: auto;}
			nav, form{display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin:1rem 0;}
			select, button{padding: .5rem; font:inherit;}
			a {color: #1856a1;}.table-container{overflow-x:auto;}
			table{border-collapse: collapse; width: 100%; margin-top: 1rem;}
			caption{text-align: left; padding: .5rem 0;}
			th,td{border: 1px solid #d1d9e3; padding: .75rem;text-align: left;}
			th{background:#edf3fa;}.empty{padding: 1rem; background: #f3f6fa;}
		</style>
	</head>
	<body>
	<main>
		<h1>Training Calendar</h1>
		<p>Approved courses for all employees.</p>
		
		<nav aria-label="Main navigation">
			<a th:href="@{/home}">Home</a>
			<a th:href="@{/logout}">Logout</a>
		</nav>
		
		<form method="get" th:action="@{/training-calendar}">
			<label for="year">Year</label>
			<select id="year" name="year">
				<option th:each="y : ${years}" th:value="${y}"
				th:text="${y}" th:selected="${y == year}"></option>
						
			</select>
			
			<label for="month">Month</label>
			<select id="month" name="month">
				<option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}" th:text="${m}" th:selected="${m == month}"></option>
			</select>
			<button type="submit">View Month</button>
		</form>
		
		<nav aria-label="Month navigation">
			<a th:if="${previousMonth != null}"
			th:href="@{/training-calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">
			Previous Month
			</a>
			<a th:href="@{/training-calendar}">Current Month</a>
			<a th:if="${nextMonth !=null}"
			th:href="@{/training-calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">
			Next Month
			</a>
		</nav>
		
		<h2 th:text="${monthLabel}">October 2026</h2>
		<p class="empty" th:if="${#lists.isEmpty(rows)}">No approved courses for this month.</p>
		
		<div class="table-container" th:unless="${#lists.isEmpty(rows)}">
			<table>
				<caption th:text="|${#lists.size(rows)} approved course application(s)|"></caption>	
				<thead>
					<tr>
						<th scope="col">Employee</th>
						<th scope="col">Course</th>
						<th scope="col">Category</th>
						<th scope="col">Training Provider</th>
						<th scope="col">Start Date</th>
						<th scope="col">End Date</th>
					</tr>
					</thead>
					<tbody>
						<tr th:each="row:${rows}">
						<td th:text="${row.employeeName}"></td>
						<td th:text="${row.courseTitle}"></td>
						<td th:text="${row.categoryName}"></td>
						<td th:text="${row.trainingProvider}"></td>
						<td th:text="${row.startDate}"></td>
						<td th:text="${row.endDate}"></td>
					</tr>
					</tbody>
				</table>
			</div>
		</main>
		</body>
		</html>
