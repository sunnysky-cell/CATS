<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATS - Course Application Form</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f8; color: #222; }
        header { background-color: #1f3a5f; color: white; padding: 18px 30px; }
        header h1 { margin: 0; font-size: 24px; }
        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .button { display: inline-block; padding: 9px 14px; border: none; border-radius: 5px;
                  text-decoration: none; cursor: pointer; font-size: 14px; }
        .primary { background-color: #1f3a5f; color: white; }
        .secondary { background-color: #68737d; color: white; }
        .error { background-color: #ffe5e5; color: #a00000; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        .error ul { margin: 6px 0 0 18px; padding: 0; }
        .success { background-color: #e6f4ea; color: #1e6b32; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        .card { background-color: white; border-radius: 8px; padding: 24px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .field { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        textarea { min-height: 90px; }
        .hint { color: #666; font-size: 12px; margin-top: 4px; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
<header>
    <h1 th:text="${isNew} ? 'New Course Application' : 'Edit Course Application'">Course Application</h1>
</header>
<main>
    <a class="button secondary" th:href="@{/employee/applications}">&larr; My Applications</a>

    <div class="error" th:if="${errors != null and !errors.isEmpty()}">
        <strong>Please fix the following:</strong>
        <ul>
            <li th:each="e : ${errors}" th:text="${e}"></li>
        </ul>
    </div>

    <div class="card">
        <form method="post"
              th:action="${isNew} ? @{/employee/applications} : @{/employee/applications/{id}(id=${form.id})}"
              th:object="${form}">

            <div class="field">
                <label>Course Title</label>
                <input type="text" th:field="*{courseTitle}" required maxlength="150">
            </div>

            <div class="field">
                <label>Category</label>
                <select th:field="*{category.id}" required>
                    <option value="">-- Select category --</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">Category</option>
                </select>
            </div>

            <div class="field">
                <label>Training Provider</label>
                <input type="text" th:field="*{trainingProvider}" required maxlength="150">
            </div>

            <div class="field">
                <label>Start Date</label>
                <input type="date" th:field="*{startDate}" required>
            </div>

            <div class="field">
                <label>End Date</label>
                <input type="date" th:field="*{endDate}" required>
            </div>

            <div class="field">
                <label>Course Fee (SGD, only for paid categories)</label>
                <input type="number" th:field="*{courseFee}" step="0.01" min="0">
                <div class="hint">Free categories will be reset to 0 by the system.</div>
            </div>

            <div class="field">
                <label>Justification / Reason</label>
                <textarea th:field="*{justification}" required maxlength="2000"></textarea>
            </div>

            <div class="field">
                <label>Work Dissemination Plan (how you will share learnings)</label>
                <textarea th:field="*{workDissemination}"></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="button primary"
                        th:text="${isNew} ? 'Submit Application' : 'Save Changes'">Submit</button>
                <a class="button secondary" th:href="@{/employee/applications}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
