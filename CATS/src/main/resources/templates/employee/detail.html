<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATS - Application Detail</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f8; color: #222; }
        header { background-color: #1f3a5f; color: white; padding: 18px 30px; }
        header h1 { margin: 0; font-size: 24px; }
        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .button { display: inline-block; padding: 9px 14px; border: none; border-radius: 5px;
                  text-decoration: none; cursor: pointer; font-size: 14px; }
        .primary { background-color: #1f3a5f; color: white; }
        .secondary { background-color: #68737d; color: white; }
        .danger { background-color: #b42318; color: white; }
        .success { background-color: #e6f4ea; color: #1e6b32; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        .error { background-color: #ffe5e5; color: #a00000; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        .card { background-color: white; border-radius: 8px; padding: 24px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .row { margin-bottom: 12px; }
        .row label { font-weight: bold; display: inline-block; min-width: 160px; color: #555; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 70px; }
        form.inline { display: inline; }
    </style>
</head>
<body>
<header>
    <h1>Application #<span th:text="${application.id}"></span></h1>
</header>
<main>
    <a class="button secondary" th:href="@{/employee/applications}">&larr; My Applications</a>

    <div class="success" th:if="${success}" th:text="${success}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="row"><label>Status:</label>
            <span class="status-badge" th:text="${application.status}"></span>
        </div>
        <div class="row"><label>Course Title:</label><span th:text="${application.courseTitle}"></span></div>
        <div class="row"><label>Category:</label><span th:text="${application.category != null ? application.category.name : '-'}"></span></div>
        <div class="row"><label>Provider:</label><span th:text="${application.trainingProvider}"></span></div>
        <div class="row"><label>Start Date:</label><span th:text="${application.startDate}"></span></div>
        <div class="row"><label>End Date:</label><span th:text="${application.endDate}"></span></div>
        <div class="row"><label>Training Days:</label><span th:text="${application.trainingDays}"></span></div>
        <div class="row"><label>Course Fee:</label><span th:text="${application.courseFee}"></span></div>
        <div class="row"><label>Justification:</label><span th:text="${application.justification}"></span></div>
        <div class="row" th:if="${application.workDissemination != null}">
            <label>Dissemination:</label><span th:text="${application.workDissemination}"></span>
        </div>
        <div class="row" th:if="${application.managerComment != null}">
            <label>Manager Comment:</label><span th:text="${application.managerComment}"></span>
        </div>
        <div class="row" th:if="${application.decisionDate != null}">
            <label>Decided At:</label><span th:text="${application.decisionDate}"></span>
        </div>
        <div class="row" th:if="${application.experienceComment != null}">
            <label>Your Feedback:</label><span th:text="${application.experienceComment}"></span>
        </div>
    </div>

    <!-- Edit: only allowed while still in APPLIED / UPDATED -->
    <div class="actions" th:if="${application.status.name() == 'APPLIED' or application.status.name() == 'UPDATED'}">
        <a class="button primary" th:href="@{/employee/applications/{id}/edit(id=${application.id})}">Edit</a>
    </div>

    <!-- Cancel / Complete: only allowed while APPROVED -->
    <div class="card" th:if="${application.status.name() == 'APPROVED'}">
        <h3>Finish up</h3>

        <form method="post" class="inline"
              th:action="@{/employee/applications/{id}/cancel(id=${application.id})}"
              th:attr="onclick='return confirm(\'Cancel this approved course?\')'">
            <button type="submit" class="button danger">Cancel Course</button>
        </form>

        <h3 style="margin-top:20px;">Mark as Completed</h3>
        <form method="post"
              th:action="@{/employee/applications/{id}/complete(id=${application.id})}">
            <div class="row">
                <label>Experience / Feedback:</label>
                <textarea name="experienceComment" placeholder="Share your learning experience..."></textarea>
            </div>
            <button type="submit" class="button success">Mark Completed</button>
        </form>
    </div>
</main>
</body>
</html>
