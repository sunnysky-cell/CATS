<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{fragments/chrome :: head('Sign in')}"></head>
  <body class="login-page">
    <link
      rel="stylesheet"
      th:href="@{/assets/login-gallery.css}"
    />
    <a
      class="skip-link"
      href="#main-content"
    >
      Skip to content
    </a>
    <header class="login-header">
      <a
        class="wordmark"
        th:href="@{/login}"
      >
        CATS
        <span>Academy</span>
      </a>
    </header>
    <main
      class="login-layout"
      id="main-content"
    >
      <section
        class="login-story login-gallery-story"
        aria-label="Learning artwork"
      >
        <figure
          class="login-gallery"
          data-login-gallery
          data-gallery-state="loading"
          data-gallery-item="1"
        >
          <div
            class="login-gallery-surface"
            data-gallery-surface
            tabindex="0"
            role="button"
            aria-label="Change gallery artwork"
            aria-describedby="gallery-help"
          >
            <canvas aria-hidden="true"></canvas>
            <div class="login-gallery-fallback">
              <img
                data-gallery-fallback
                th:src="@{/assets/login-gallery-images/discover-courses.svg}"
                alt="Discover courses, an original CATS illustration"
                width="960"
                height="960"
              />
            </div>
          </div>
          <figcaption class="sr-only">
            <div class="login-gallery-title">
              <strong
                data-gallery-caption
                aria-live="polite"
              >
                Discover courses
              </strong>
              <span data-gallery-index>01 / 03</span>
            </div>
          </figcaption>
          <p
            class="sr-only"
            id="gallery-help"
          >
            Click the artwork to switch, or focus it and use Enter or the left and right arrow keys.
            On a touch screen, swipe horizontally.
          </p>
        </figure>
      </section>
      <section
        class="login-form-side"
        aria-labelledby="signin-title"
      >
        <div class="login-form-wrap">
          <h1 id="signin-title">Welcome back</h1>
          <p
            th:text="${adminMode} ? 'Sign in to your administrator workspace.' : 'Sign in with your organization account.'"
          >
            Sign in with your organization account.
          </p>
          <nav
            class="login-switch"
            aria-label="Sign-in type"
          >
            <a
              th:href="@{/login}"
              th:classappend="${adminMode != true} ? 'selected'"
              th:attr="aria-current=${adminMode != true} ? 'page' : null"
            >
              Employee &amp; manager
            </a>
            <a
              th:href="@{/admin/login}"
              th:classappend="${adminMode} ? 'selected'"
              th:attr="aria-current=${adminMode} ? 'page' : null"
            >
              Admin
            </a>
          </nav>
          <div
            class="error"
            role="alert"
            tabindex="-1"
            data-server-errors
            th:if="${error}"
            th:text="${error}"
          ></div>
          <!-- th:action lets Spring/Thymeleaf supply the current CSRF token. -->
          <form
            method="post"
            th:action="@{/login}"
            data-processing-form
          >
            <input
              type="hidden"
              name="adminMode"
              th:value="${adminMode}"
            />
            <div class="field">
              <label for="username">Username</label>
              <input
                id="username"
                type="text"
                name="username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input
                  id="password"
                  type="password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  aria-controls="password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </div>
            <button
              type="submit"
              class="button login-submit"
            >
              Sign in
              <span
                data-icon="arrowRight"
                aria-hidden="true"
              ></span>
            </button>
            <p
              class="sr-only"
              data-submission-status
              role="status"
            ></p>
          </form>
          <p class="login-footnote">Need an account? Contact your administrator.</p>
        </div>
      </section>
    </main>
    <footer class="login-footer">
      <span>Learning, at your own pace.</span>
      <span>CATS / Academy</span>
    </footer>
    <script
      type="module"
      th:src="@{/assets/login-gallery.js}"
    ></script>
  </body>
</html>
