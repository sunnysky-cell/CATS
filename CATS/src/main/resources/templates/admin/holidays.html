<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{fragments/chrome :: head('Public holidays')}"></head>
  <body class="admin-page">
    <a
      class="skip-link"
      href="#main-content"
    >
      Skip to content
    </a>
    <aside th:replace="~{fragments/chrome :: sidebar('holidays')}"></aside>
    <div class="app-frame">
      <header th:replace="~{fragments/chrome :: topbar('Public holidays')}"></header>
      <main
        id="main-content"
        class="page-content"
      >
        <header class="page-header">
          <div>
            <h1>Public holidays</h1>
            <p>Exclude these dates when calculating training days.</p>
          </div>
          <a
            class="button"
            href="#add-holiday"
          >
            Add holiday
          </a>
        </header>
        <div class="page-body">
          <div
            class="error"
            th:if="${error}"
            th:text="${error}"
            role="alert"
          ></div>
          <section
            class="section admin-records"
            aria-label="Holiday calendar"
          >
            <div class="admin-year-nav">
              <form
                method="get"
                th:action="@{/admin/holidays}"
              >
                <label for="holiday-year">Year</label>
                <input
                  id="holiday-year"
                  type="number"
                  name="year"
                  min="2000"
                  max="2100"
                  th:value="${year}"
                  required
                />
                <button
                  type="submit"
                  class="button"
                >
                  View
                </button>
              </form>
              <div class="actions">
                <a
                  class="button text"
                  th:href="@{/admin/holidays(year=${year - 1})}"
                >
                  Previous year
                </a>
                <a
                  class="button text"
                  th:href="@{/admin/holidays(year=${year + 1})}"
                >
                  Next year
                </a>
              </div>
            </div>
            <div class="table-wrapper">
              <table
                class="table admin-holidays-table"
                data-searchable="true"
              >
                <caption class="sr-only">
                  Public holidays for
                  <span th:text="${year}">Year</span>
                </caption>
                <thead>
                  <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Holiday</th>
                    <th scope="col"><span class="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="h : ${holidays}">
                    <td
                      data-label="Date"
                      class="admin-record-number"
                      th:text="${#temporals.format(h.holidayDate, 'yyyy-MM-dd')}"
                    ></td>
                    <td
                      data-label="Holiday"
                      th:text="${h.description}"
                    ></td>
                    <td data-label="Actions">
                      <form
                        method="post"
                        th:action="@{/admin/holidays/{id}/delete(id=${h.id})}"
                        data-confirm="Delete this public holiday?"
                      >
                        <input
                          type="hidden"
                          name="year"
                          th:value="${year}"
                        />
                        <button
                          type="submit"
                          class="button text danger"
                        >
                          Delete
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(holidays)}">
                    <td
                      colspan="3"
                      class="empty"
                    >
                      No public holidays recorded for this year.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
          <section
            id="add-holiday"
            class="section admin-edit-section"
          >
            <div class="admin-section-heading">
              <h2>Add holiday</h2>
              <p>Add a date to the working calendar.</p>
            </div>
            <form
              method="post"
              th:action="@{/admin/holidays/new}"
            >
              <div class="admin-form-grid">
                <div class="field">
                  <label for="holiday-date">
                    Holiday date
                    <span class="required">*</span>
                  </label>
                  <input
                    id="holiday-date"
                    type="date"
                    name="holidayDate"
                    required
                  />
                </div>
                <div class="field">
                  <label for="holiday-description">
                    Holiday name
                    <span class="required">*</span>
                  </label>
                  <input
                    id="holiday-description"
                    type="text"
                    name="description"
                    maxlength="150"
                    required
                  />
                </div>
              </div>
              <div class="actions admin-form-actions">
                <button
                  type="submit"
                  class="button primary"
                >
                  Add holiday
                </button>
              </div>
            </form>
          </section>
        </div>
        <footer th:replace="~{fragments/chrome :: footer}"></footer>
      </main>
    </div>
  </body>
</html>
