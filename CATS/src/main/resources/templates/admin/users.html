<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CATS - Manage Users</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        header {
            background-color: #1f3a5f;
            color: white;
            padding: 18px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .primary {
            background-color: #1f3a5f;
            color: white;
        }

        .secondary {
            background-color: #68737d;
            color: white;
        }

        .danger {
            background-color: #b42318;
            color: white;
        }

        .success {
            background-color: #287a3c;
            color: white;
        }

        .error {
            background-color: #ffe5e5;
            color: #a00000;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #e9eef3;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .status-active {
            color: #287a3c;
            font-weight: bold;
        }

        .status-disabled {
            color: #b42318;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
        }

        .actions form {
            margin: 0;
        }

        .empty {
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>
        Manage Users
    </h1>
</header>


<main>

    <div class="toolbar">

        <a class="button secondary"
           th:href="@{/admin/home}">
            ← Admin Home
        </a>

        <a class="button primary"
           th:href="@{/admin/users/new}">
            + New User
        </a>

    </div>


    <!-- Controller business error -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>


    <div class="table-wrapper">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Name</th>
                <th>Role</th>
                <th>Designation</th>
                <th>Manager</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>


            <tbody>

            <tr th:each="u : ${users}">

                <td th:text="${u.id}">
                </td>

                <td th:text="${u.username}">
                </td>

                <td th:text="${u.name}">
                </td>

                <td th:text="${u.role}">
                </td>

                <td th:text="${u.designation}">
                </td>

                <td th:text="${u.manager != null
                              ? u.manager.name
                              : '-'}">
                </td>

                <td>

                    <span class="status-active"
                          th:if="${u.enabled}">
                        Enabled
                    </span>

                    <span class="status-disabled"
                          th:unless="${u.enabled}">
                        Disabled
                    </span>

                </td>


                <td>

                    <div class="actions">

                        <!-- EDIT -->
                        <a class="button primary"
                           th:href="@{/admin/users/{id}/edit(id=${u.id})}">
                            Edit
                        </a>


                        <!-- ENABLE / DISABLE -->
                        <form method="post"
                              th:action="@{/admin/users/{id}/toggle(id=${u.id})}">

                            <button type="submit"
                                    class="button"
                                    th:classappend="${u.enabled}
                                        ? ' danger'
                                        : ' success'"
                                    th:text="${u.enabled}
                                        ? 'Disable'
                                        : 'Enable'"
                                    th:attr="onclick=${u.enabled}
                                        ? 'return confirm(\'Disable this user?\')'
                                        : 'return confirm(\'Enable this user?\')'">
                            </button>

                        </form>

                    </div>

                </td>

            </tr>


            <tr th:if="${#lists.isEmpty(users)}">

                <td colspan="8"
                    class="empty">

                    No users found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
